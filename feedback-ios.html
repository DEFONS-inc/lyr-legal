<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reflexible フィードバック (iPhone) / Feedback</title>
<!--
  Reflexible iOS 版の「フィードバックを送る」からの入口 (2026-10-31)。Android 版の feedback.html と同じ作り。

  ★iOS 版のフォームを別に持つ理由: 訳す対象 (動画のみ)・気になる点 (小窓・画面収録)・自動で入る欄 (iOS の版) が
  Android と違うため。フォームは lyr-ui7 の scripts/release/create_reflexible_feedback_forms.gs で
  DEFONS の Google アカウントで作った (2026-11-26・旧 LYR のフォームは回答 0 件のまま破棄)。

  ★アプリはフォームを直接指さず、必ずこのページを経由する。出荷したアプリの URL は後から変えられないが、
  ここを挟めば下の FORMS を書き換えるだけで全端末が追従する。

  アプリは短いキーで端末の情報を渡す: v (版) / d (機種) / o (iOS の版) / l (表示の言語)。
  フォームの entry ID への対応はこの MAP だけに置く。

  言語の振り分け: l が ja で始まれば日本語版、それ以外は英語版。l が無ければブラウザの言語で同じ判定。
  ★差し替え直後の 10 分間は古い版が使われる (GitHub Pages の Cache-Control: max-age=600)。
-->
<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: #3a3a3a; background: #fbfbfa;
  }
  main { text-align: center; padding: 24px; }
  a { color: #2b6cb0; }
  @media (prefers-color-scheme: dark) {
    body { color: #d6d6d6; background: #1b1b1b; }
    a { color: #7fb3e8; }
  }
</style>
</head>
<body>
<main>
  <p>フィードバックフォームを開いています… / Opening the feedback form…</p>
  <p><a id="fallback" href="#">開かない場合はこちら / Tap here if it does not open</a></p>
</main>
<script>
(function () {
  // ==== 差し替えるのはここと、末尾 noscript の URL ====
  var FORMS = {
    ja: {
      form: "https://docs.google.com/forms/d/e/1FAIpQLSeTT9AicO0NkZn73dhZTYFjq-xhuj4tVTBYjRZEL9wCJt2rPA/viewform",
      map: {
        v: "entry.509559962",  // アプリのバージョン
        d: "entry.2129571102",  // 機種
        o: "entry.1512256427",  // iOS のバージョン
        l: "entry.1356631919"    // 表示の言語
      }
    },
    en: {
      form: "https://docs.google.com/forms/d/e/1FAIpQLScNwOKlT4IRvPxoG28TMgpu1g2xJyEjvMoh9o3BhKLm1Mwd5w/viewform",
      map: {
        v: "entry.1970977715",
        d: "entry.1532346874",
        o: "entry.1675142777",
        l: "entry.1814655300"
      }
    }
  };
  // ====================================

  var params = new URLSearchParams(location.search);
  var lang = (params.get("l") || navigator.language || "ja").toLowerCase();
  var pick = lang.indexOf("ja") === 0 ? FORMS.ja : FORMS.en;
  if (pick === FORMS.en) document.documentElement.lang = "en";
  var out = new URLSearchParams();
  Object.keys(pick.map).forEach(function (key) {
    var value = params.get(key);
    if (value) out.set(pick.map[key], value);
  });
  var target = pick.form;
  if (out.toString()) {
    out.set("usp", "pp_url");
    target = pick.form + "?" + out.toString();
  }
  document.getElementById("fallback").href = target;
  // replace: 戻るボタンでこの中継ページに戻らないようにする
  location.replace(target);
})();
</script>
<noscript>
  <!-- ★上の FORMS と同じ URL。JS 無効だとスクリプトから書き換えられないため、ここだけは重複を持つ。 -->
  <p><a href="https://docs.google.com/forms/d/e/1FAIpQLSeTT9AicO0NkZn73dhZTYFjq-xhuj4tVTBYjRZEL9wCJt2rPA/viewform">フィードバックフォームを開く</a></p>
  <p><a href="https://docs.google.com/forms/d/e/1FAIpQLScNwOKlT4IRvPxoG28TMgpu1g2xJyEjvMoh9o3BhKLm1Mwd5w/viewform">Open the feedback form (English)</a></p>
</noscript>
</body>
</html>
